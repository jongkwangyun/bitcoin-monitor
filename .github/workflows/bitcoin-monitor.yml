# GitHub Actions 비활성화 - 로컬 run_local_monitor.bat 으로 대체
# 재활성화하려면 아래 'if: false' 를 제거하세요

name: Bitcoin monitor (Upbit + Telegram)

on:
  workflow_dispatch:

jobs:
  monitor:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore alert and report cache
        uses: actions/cache@v4
        with:
          path: |
            .btc_alert_cache.json
            .btc_report_state.json
          key: btc-state-${{ github.run_id }}
          restore-keys: |
            btc-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily job (snapshot + Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPBIT_MARKET: KRW-BTC
        run: python daily_job.py
