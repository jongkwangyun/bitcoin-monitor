# 30분마다 실행
# 필요 시 Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

name: Bitcoin monitor (Upbit + Telegram)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore alert and report cache
        uses: actions/cache@v4
        with:
          path: |
            .btc_alert_cache.json
            .btc_report_state.json
          key: btc-state-${{ github.run_id }}
          restore-keys: |
            btc-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily job (snapshot + Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPBIT_MARKET: KRW-BTC
        run: python daily_job.py
